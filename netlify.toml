[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "SB_URL"

[functions]
  directory = "netlify/functions"

# These reach only what Netlify serves from the publish directory. Every page
# on this site is rendered by the Next runtime and never matched here, which is
# why production served none of them — see SECURITY_HEADERS in next.config.ts,
# which is the copy that actually applies. Keep the two identical.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options   = "nosniff"
    X-Frame-Options          = "DENY"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=()"
    Content-Security-Policy  = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.clarity.ms https://scripts.clarity.ms; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.supabase.co https://s0.wp.com https://*.clarity.ms https://www.googletagmanager.com https://*.google-analytics.com https://*.g.doubleclick.net https://www.google.com https://www.google.co.in; font-src 'self'; media-src 'self' https://*.supabase.co; frame-src https://www.instagram.com https://instagram.com; connect-src 'self' https://*.supabase.co https://api.resend.com https://*.clarity.ms https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://*.g.doubleclick.net https://www.google.com https://www.google.co.in; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://wa.me"
